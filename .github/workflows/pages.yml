name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "Scripts/check-web.mjs", "Sources/Meownitor/CatProfile.swift", "Sources/Meownitor/CatPackStore.swift", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["web/**", "Scripts/check-web.mjs", "Sources/Meownitor/CatProfile.swift", "Sources/Meownitor/CatPackStore.swift", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node Scripts/check-web.mjs
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
