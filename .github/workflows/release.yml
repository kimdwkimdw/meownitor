name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: Scripts/bootstrap-bundled-assets.sh
      - run: swift test
      - run: Scripts/build-app.sh --arch arm64 --arch x86_64
      - run: codesign --verify --deep --strict .build/Meownitor.app
      - run: mkdir -p dist && ditto -c -k --norsrc --noextattr --keepParent .build/Meownitor.app dist/Meownitor-macOS-universal.zip
      - name: Publish a new release only when one does not already exist
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; verified its source without replacing published artifacts."
          else
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" dist/Meownitor-macOS-universal.zip --generate-notes --title "Meownitor $GITHUB_REF_NAME" "${flags[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
